<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Booking System</title>
    <link rel="stylesheets" href="./../../../index files/style.css">
    <link rel="stylesheet" href="./appointments.css">
</head>
<body class="page-shell appointments-page">
    <div class="appointments-container">
        <!-- Header -->
        <div class="appointments-header">
            <a href="./../../../index files/index.html" class="back-link">â† Back to Home</a>
            <h1>Book Your Appointment</h1>
            <p class="subtitle">Simple and quick booking for your beauty services</p>
        </div>

        <!-- Tabs Navigation -->
        <div class="tabs-navigation">
            <button class="tab-btn active" data-tab="booking">
                ðŸ“… Book Appointment
            </button>
            <button class="tab-btn" data-tab="booked">
                âœ“ My Appointments
            </button>
        </div>

        <!-- Tab 1: Booking Form -->
        <div id="booking" class="tab-content active">
            <div class="booking-section">
                <form id="appointmentForm" class="appointment-form">
                    <!-- Service Selection -->
                    <div class="form-section">
                        <h3>Step 1: Select Service</h3>
                        <div class="service-grid" id="serviceGrid">
                            <!-- Services will be populated by JS -->
                        </div>
                    </div>

                    <!-- Date & Time Selection -->
                    <div class="form-section">
                        <h3>Step 2: Choose Date & Time</h3>
                        <div class="date-time-container">
                            <div class="date-picker-wrapper">
                                <label for="appointmentDate">Select Date</label>
                                <input type="date" id="appointmentDate" required>
                            </div>
                            <div class="time-slots-wrapper">
                                <label>Select Time</label>
                                <div class="time-slots" id="timeSlots">
                                    <!-- Time slots will be populated by JS -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Contact Information -->
                    <div class="form-section">
                        <h3>Step 3: Your Information</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="fullName">Full Name *</label>
                                <input type="text" id="fullName" required placeholder="Enter your full name">
                            </div>
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" required placeholder="your@email.com">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="phone">Phone *</label>
                                <input type="tel" id="phone" required placeholder="(123) 456-7890">
                            </div>
                            <div class="form-group">
                                <label for="duration">Duration</label>
                                <select id="duration">
                                    <option value="30">30 minutes</option>
                                    <option value="60" selected>60 minutes</option>
                                    <option value="90">90 minutes</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Notes -->
                    <div class="form-section">
                        <label for="notes">Additional Notes (Optional)</label>
                        <textarea id="notes" rows="3" placeholder="Any special requests or notes..."></textarea>
                    </div>

                    <!-- Summary & Submit -->
                    <div class="booking-summary" id="bookingSummary">
                        <!-- Summary will be populated by JS -->
                    </div>

                    <button type="submit" class="btn-submit">Book Appointment</button>
                </form>

                <!-- Success Message -->
                <div id="successMessage" class="success-message" style="display: none;">
                    <div class="success-content">
                        <h2>âœ“ Appointment Booked!</h2>
                        <p id="successText"></p>
                        <button type="button" class="btn-secondary" onclick="resetForm()">Book Another</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: My Appointments -->
        <div id="booked" class="tab-content">
            <div class="booked-section">
                <h3>Your Appointments</h3>
                <div id="appointmentsList" class="appointments-list">
                    <!-- Appointments will be populated by JS -->
                </div>
                <div id="noAppointments" class="no-appointments" style="display: none;">
                    <p>No appointments yet. <span class="link-text" onclick="switchTab('booking')">Book one now!</span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="./appointments.js"></script>
</body>
</html>
