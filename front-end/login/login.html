<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/styles/variables.css">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/login/login.css">
</head>
<body class="page-shell">
    <main class="form-card" style="position:relative">
        <p class="hero__eyebrow">Private atelier</p>
        <h1 id="authTitle" style="font-family:'Cormorant Garamond',serif; letter-spacing:-0.02em">Welcome back</h1>
        <p id="authSubtitle">Sign in to secure your appointment — instant confirmation.</p>
        <p id="authMessage" class="form-message" hidden></p>
        <form class="simple-form" id="authForm">
            <label for="name" id="nameLabel" hidden>Name:</label>
            <input type="text" id="name" name="name" hidden>

            <label for="email">Email (Gmail only):</label>
            <div style="display:flex; gap:8px">
                <input type="email" id="email" name="email" required placeholder="yourname@gmail.com" style="flex:1">
                <button type="button" class="button button--light" id="sendOtp" style="padding:12px 16px; white-space:nowrap; font-size:0.88rem">Send OTP</button>
            </div>
            <p id="otpInfo" style="font-size:0.82rem; color:var(--muted); margin-top:4px" hidden>OTP sent to your Gmail — expires in 5 min</p>

            <label for="otp" id="otpLabel">Gmail OTP (6 digits):</label>
            <div style="display:flex; gap:8px">
                <input type="text" id="otp" name="otp" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="123456" required style="flex:1; letter-spacing:4px; text-align:center; font-weight:700">
                <button type="button" class="button button--light" id="verifyOtp" style="padding:12px 16px; white-space:nowrap; font-size:0.88rem">Verify</button>
            </div>
            <p id="otpStatus" style="font-size:0.85rem; margin-top:4px" hidden></p>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required minlength="6">

            <label class="remember-me">
                <input type="checkbox" id="rememberMe"> Remember email
            </label>

            <button class="button button--dark" type="submit" id="authSubmit">Login</button>
        </form>
        <p>
            <button type="button" class="button button--light" id="authToggle">Need an account? Register</button>
        </p>
    </main>
    <script src="/scripts/common.js"></script>
    <script src="/scripts/header.js"></script>
    <script src="/login/login.js"></script>
</body>
</html>
