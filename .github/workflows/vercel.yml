name: Vercel Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g vercel@latest
      - run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
